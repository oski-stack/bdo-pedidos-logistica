spring:
  application:
    name: pedidos-logistica
  datasource:
    # H2 en memoria: el esquema se crea con Flyway en cada arranque (D9).
    url: jdbc:h2:mem:pedidos;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      # Flyway es el dueño del esquema; Hibernate solo comprueba que las entidades cuadran.
      ddl-auto: validate
    # Sin sesión abierta durante la vista: cualquier carga perezosa fuera de la transacción falla pronto.
    open-in-view: false
  flyway:
    enabled: true
  jackson:
    deserialization:
      # Sin esto, "cantidad": 1.9 se leería como 1 sin avisar. Así da 400 (D1: cantidad entera).
      accept-float-as-int: false

server:
  port: 8080

# Proveedor logístico de tarifas (D6, D8).
proveedor:
  url-base: ${PROVEEDOR_URL:http://localhost:8089}
  # Solo desde la variable de entorno. Vacío por defecto: @NotBlank hace que la app no arranque sin él.
  token: ${PROVEEDOR_TOKEN:}
  # Por intento. El proveedor puede tardar hasta 5 s legítimamente.
  timeout-conexion: 1s
  timeout-lectura: 6s
  reintentos:
    max-intentos: 2
    espera-inicial: 200ms
    multiplicador: 2.0
    jitter: 0.5
